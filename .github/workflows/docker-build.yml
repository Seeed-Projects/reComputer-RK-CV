name: Build reComputer-RK-CV Images (Multi-Platform)

on:
  push:
    branches: [main, master]
    paths:
      - 'src/rk3588_yolo11/**'
      - 'src/rk3576_yolo11/**'
      - 'src/rk3588_yolov8_obb/**'
      - 'src/rk3576_yolov8_obb/**'
      - 'src/rk3588_yolov5/**'
      - 'src/rk3576_yolov5/**'
      - 'src/rk3588_yolov5_seg/**'
      - 'src/rk3576_yolov5_seg/**'
      - 'src/rk3588_yolov8/**'
      - 'src/rk3576_yolov8/**'
      - 'src/rk3588_yolov8_pose/**'
      - 'src/rk3576_yolov8_pose/**'
      - 'src/rk3588_yolov8_seg/**'
      - 'src/rk3576_yolov8_seg/**'
      - 'src/rk3588_whisper/**'
      - 'src/rk3576_whisper/**'
      - 'docker/**'
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (e.g. rk3588_yolo11, rk3588_yolov5, all)'
        required: true
        default: 'all'
      image_tag:
        description: 'Custom image tag'
        required: false
        default: 'latest'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: 
          - rk3588_yolo11
          - rk3576_yolo11
          - rk3588_yolov8_obb
          - rk3576_yolov8_obb
          - rk3588_yolov5
          - rk3576_yolov5
          - rk3588_yolov5_seg
          - rk3576_yolov5_seg
          - rk3588_yolov8
          - rk3576_yolov8
          - rk3588_yolov8_pose
          - rk3576_yolov8_pose
          - rk3588_yolov8_seg
          - rk3576_yolov8_seg
          - rk3588_whisper
          - rk3576_whisper
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check if build is needed
        id: check_changes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.platform }}" == "all" || "${{ github.event.inputs.platform }}" == "${{ matrix.platform }}" ]]; then
              echo "build=true" >> $GITHUB_OUTPUT
            else
              echo "build=false" >> $GITHUB_OUTPUT
            fi
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            # Check if files in src/${{ matrix.platform }} or docker/${{ matrix.platform }} changed
            # For simplicity in this environment, we assume true if it matches matrix, 
            # but in real git we would use git diff
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=true" >> $GITHUB_OUTPUT
          fi

      - name: Prepare Image Name
        if: steps.check_changes.outputs.build == 'true'
        run: |
          # Use reComputer-RK-CV as the base repo name if renamed, otherwise use repo name
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          # We only want to replace the FIRST underscore with a hyphen.
          # For example, rk3588_yolov5_seg -> rk3588-yolov5_seg
          IMAGE_NAME=$(echo "${{ matrix.platform }}" | sed 's/_/-/')
          
          echo "GHCR_IMAGE=ghcr.io/${REPO_NAME}/${IMAGE_NAME}" >> $GITHUB_ENV
          
          TAG="latest"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.image_tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV

      - name: Set up QEMU
        if: steps.check_changes.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_changes.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.check_changes.outputs.build == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Dockerfile Path
        if: steps.check_changes.outputs.build == 'true'
        run: |
          # Convert platform like rk3588_yolov5_seg to rk3588/yolov5_seg.dockerfile
          # We extract the prefix (rk3588 or rk3576) and the model part.
          PLATFORM="${{ matrix.platform }}"
          HW_PREFIX="${PLATFORM%%_*}"
          MODEL_SUFFIX="${PLATFORM#*_}"
          
          # Special cases for older names or capitalizations if needed
          if [[ "$MODEL_SUFFIX" == "yolo11" ]]; then
            DOCKERFILE_NAME="Yolo11.dockerfile"
          elif [[ "$MODEL_SUFFIX" == "yolov8_obb" ]]; then
            DOCKERFILE_NAME="Yolov8-obb.dockerfile"
          else
            DOCKERFILE_NAME="${MODEL_SUFFIX}.dockerfile"
          fi
          
          echo "DOCKERFILE_PATH=docker/${HW_PREFIX}/${DOCKERFILE_NAME}" >> $GITHUB_ENV

      - name: Build and Push (arm64 Only)
        if: steps.check_changes.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: src/${{ matrix.platform }}
          file: ${{ env.DOCKERFILE_PATH }}
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: steps.check_changes.outputs.build == 'true'
        run: echo "Successfully built ${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}"
