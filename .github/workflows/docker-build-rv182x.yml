name: Build RK182x CV Images
on:
  push:
    branches: [main, master]
    paths:
      - 'src/rv182x_rk3588_yolo26/**'
      - 'docker/rv182x-rk3588/**'
      - '.github/workflows/docker-build-rv182x.yml'
  pull_request:
    paths:
      - 'src/rv182x_rk3588_yolo26/**'
      - 'docker/rv182x-rk3588/**'
      - '.github/workflows/docker-build-rv182x.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          sparse-checkout: |
            src/rv182x_rk3588_yolo26
            docker/rv182x-rk3588
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/rv182x-rk3588-yolo26" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: src/rv182x_rk3588_yolo26
          file: docker/rv182x-rk3588/yolo26.dockerfile
          platforms: linux/arm64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
