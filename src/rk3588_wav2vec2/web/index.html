<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wav2Vec2 English ASR</title><link rel="stylesheet" href="/style.css"></head><body><header><span class="badge">Rockchip NPU · 16 kHz · 20 seconds</span><h1>Wav2Vec2 English Transcription</h1><p>Upload an audio file or record from the browser microphone, then transcribe English speech on the NPU.</p></header><main class="grid"><section class="card"><h2>Audio input</h2><label>Audio file</label><input id="file" type="file" accept="audio/*,.wav"><audio id="player" controls></audio><canvas id="wave"></canvas><button id="record">Start recording</button><button id="stop" class="danger" disabled>Stop</button><button id="run">Transcribe</button><div id="status" class="status"></div></section><section class="card"><h2>Transcript</h2><div id="text" class="result">The English transcript will appear here.</div><p id="meta" class="muted"></p></section><section class="card wide links"><a href="/docs">OpenAPI documentation</a><a href="/api/health">Health status</a></section></main><script src="/audio.js"></script><script>const $=id=>document.getElementById(id);let audioFile=null;$('file').onchange=()=>{audioFile=$('file').files[0];if(audioFile)previewAudio(audioFile,$('player'),$('wave'))};$('record').onclick=async()=>{try{await startRecorder(data=>drawWave($('wave'),data));$('record').disabled=true;$('stop').disabled=false;$('status').textContent='Recording…';$('status').className='status'}catch(e){$('status').textContent=e.message;$('status').className='status error'}};$('stop').onclick=async()=>{const blob=await stopRecorder();audioFile=new File([blob],'browser-recording.wav',{type:'audio/wav'});$('player').src=URL.createObjectURL(blob);$('record').disabled=false;$('stop').disabled=true;$('status').textContent='Recording ready.'};$('run').onclick=async()=>{const s=$('status');if(!audioFile){s.textContent='Choose or record audio first.';s.className='status error';return}const f=new FormData();f.append('file',audioFile);s.textContent='Transcribing…';s.className='status';try{const d=await requestJson('/api/models/wav2vec2/predict',{method:'POST',body:f}),x=d.result;$('text').textContent=x.text||'(no speech recognized)';$('meta').textContent=`Processed ${x.processed_duration_seconds} s · ${d.inference_time_ms} ms${x.truncated?' · input truncated to 20 s':''}`;s.textContent='Transcription complete.'}catch(e){s.textContent=e.message;s.className='status error'}};</script></body></html>
