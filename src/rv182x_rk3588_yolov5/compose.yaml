services:
  app:
    image: rv182x-rk3588-yolov5:local
    container_name: rv182x-rk3588-yolov5
    build:
      context: .
      dockerfile: ../../docker/rv182x-rk3588/yolov5.dockerfile
    privileged: true
    network_mode: host
    ipc: host
    environment:
      MODEL_VARIANT: ${MODEL_VARIANT:-yolov5n}
    stop_grace_period: 5m
    volumes:
      - /run/lock:/run/lock
      - /lib/modules:/lib/modules:ro
      - /usr/src:/usr/src:ro
      - ./workspace:/app/workspace
    restart: unless-stopped
