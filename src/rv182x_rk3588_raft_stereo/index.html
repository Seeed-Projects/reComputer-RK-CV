<!doctype html><html><head><meta charset="utf-8"><title>reComputer RK-CV · RAFT-Stereo</title>
<style>body{background:#1a1a1a;color:white;font-family:sans-serif;text-align:center;padding:20px}main{max-width:1000px;margin:auto}h1{color:#00e676}.panel{background:#2a2a2a;border-radius:10px;padding:24px;margin:20px}button{background:#00e676;padding:10px;border:0;border-radius:4px}img{max-width:100%}label{display:block;margin:15px}pre{text-align:left;white-space:pre-wrap}</style></head>
<body><main><h1>RAFT-Stereo · RK1820 PCIe / RK3588</h1><p id="status"></p><div class="panel">
<p>Upload synchronized, rectified left/right images of the same scene. A monocular traffic video cannot supply a stereo pair.</p>
<form id="pair"><label>Left image <input name="left" type="file" accept="image/*" required></label><label>Right image <input name="right" type="file" accept="image/*" required></label><button>Estimate disparity</button></form></div>
<div class="panel"><h2>Disparity preview</h2><img id="result" src="/api/sample"><pre id="details"></pre></div><a href="/docs" style="color:#00e676">API Docs</a></main>
<script>fetch('/api/health').then(r=>r.json()).then(s=>document.getElementById('status').textContent=s.model+' · W8A8 · '+s.iterations+' iteration');
document.getElementById('pair').addEventListener('submit',async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;try{const r=await fetch('/api/predict',{method:'POST',body:new FormData(e.target)});const d=await r.json();if(!r.ok)throw Error(JSON.stringify(d));const p=d.predictions[0];document.getElementById('result').src='data:image/png;base64,'+p.visualization_png;delete p.visualization_png;document.getElementById('details').textContent=JSON.stringify(d,null,2);}catch(err){document.getElementById('details').textContent=err.message;}finally{btn.disabled=false;}});</script></body></html>
