services:
  app:
    image: rv182x-rk3588-yolo26:local
    container_name: rv182x-rk3588-yolo26
    build:
      context: .
      dockerfile: ../../docker/rv182x-rk3588/yolo26.dockerfile
    privileged: true
    network_mode: host
    ipc: host
    environment:
      MODEL_VARIANT: ${MODEL_VARIANT:-yolo26n}
    volumes:
      - ./workspace:/app/workspace
    restart: unless-stopped
