services:
  yolo26:
    image: rv182x-rk3588-yolo26:latest
    container_name: rv182x-rk3588-yolo26
    build:
      context: .
      dockerfile: ../../docker/rv182x-rk3588/yolo26.dockerfile
    platform: linux/arm64
    # The SDK host proxy uses localhost TCP and PCIe DMA/shared memory.
    network_mode: host
    ipc: host
    privileged: true
    restart: unless-stopped
    volumes:
      - ./workspace:/app/workspace
