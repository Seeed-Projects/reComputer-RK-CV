services:
  app:
    image: rv182x-rk3588-depth-anything-v3:local
    container_name: rv182x-rk3588-depth-anything-v3
    build:
      context: .
      dockerfile: ../../docker/rv182x-rk3588/depth-anything-v3.dockerfile
    privileged: true
    network_mode: host
    ipc: host
    environment:
      MODEL_VARIANT: ${MODEL_VARIANT:-da3-base}
    volumes:
      - ./workspace:/app/workspace
    restart: unless-stopped
